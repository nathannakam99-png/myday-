<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Journée">
<meta name="theme-color" content="#0d0d1a">
<title>Ma Journée</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d1a;
  --s1:rgba(255,255,255,0.04);
  --s2:rgba(255,255,255,0.07);
  --b1:rgba(255,255,255,0.06);
  --b2:rgba(255,255,255,0.12);
  --b3:rgba(255,255,255,0.22);
  --cream:#ede8de;
  --cream2:rgba(237,232,222,0.55);
  --cream3:rgba(237,232,222,0.22);
  --gold:#d4a85a;
  --gold2:#f0c97a;
  --goldbg:rgba(212,168,90,0.12);
  --goldbdr:rgba(212,168,90,0.28);
  --em:#6ecf9e;
  --embg:rgba(110,207,158,0.1);
  --embdr:rgba(110,207,158,0.3);
  --rose:#f08080;
  --rosebg:rgba(240,128,128,0.08);
  --rosebdr:rgba(240,128,128,0.28);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:'Jost',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}

/* BG */
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);animation:pulse 8s ease-in-out infinite alternate}
.b1{width:400px;height:400px;top:-120px;left:-100px;background:radial-gradient(circle,#1e2a6e,transparent 70%);opacity:.7;animation-duration:10s}
.b2{width:350px;height:350px;bottom:-80px;right:-80px;background:radial-gradient(circle,#3d1e6e,transparent 70%);opacity:.6;animation-duration:13s;animation-delay:-5s}
.b3{width:280px;height:280px;top:45%;left:50%;background:radial-gradient(circle,#1e4a3a,transparent 70%);opacity:.4;animation-duration:11s;animation-delay:-3s;animation-name:pulse3}
.b4{width:180px;height:180px;top:20%;right:10%;background:radial-gradient(circle,#6e4a1e,transparent 70%);opacity:.35;animation-duration:9s;animation-delay:-7s}
@keyframes pulse{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.12) translate(15px,10px)}}
@keyframes pulse3{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(calc(-50% + 12px),calc(-50% + 8px)) scale(1.1)}}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.025}

/* LAYOUT */
.wrap{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}

/* HEADER */
.hdr{padding:28px 24px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.hdr-l .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.hdr-l .headline{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;line-height:1;color:var(--cream)}
.hdr-l .headline em{font-style:italic;color:var(--gold2)}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px;padding-top:2px}
.date-chip{font-size:11px;color:var(--gold);background:var(--goldbg);border:1px solid var(--goldbdr);border-radius:30px;padding:5px 13px;letter-spacing:.04em;white-space:nowrap}
.reset-btn{font-size:10px;color:var(--cream3);background:none;border:none;font-family:'Jost',sans-serif;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.reset-btn:hover{color:var(--rose)}

/* NAV TABS */
.nav{display:flex;gap:4px;padding:0 20px 14px;flex-shrink:0}
.nav-tab{
  flex:1;padding:9px 0;border-radius:14px;
  border:1px solid transparent;
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--cream3);background:none;font-family:'Jost',sans-serif;
  cursor:pointer;transition:all .2s;font-weight:500;
}
.nav-tab:hover{background:var(--s1);color:var(--cream2)}
.nav-tab.active{background:var(--goldbg);border-color:var(--goldbdr);color:var(--gold)}

/* PAGES */
.page{display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.page.active{display:flex}

/* ── TODAY PAGE ── */
.day-strip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:0 20px 14px;flex-shrink:0}
.day-strip::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 10px 9px;border-radius:18px;cursor:pointer;border:1px solid transparent;transition:all .2s;min-width:50px}
.day-btn:hover{background:var(--s2)}
.day-btn.active{background:var(--s2);border-color:var(--b2)}
.day-btn.active.is-today{border-color:var(--goldbdr);background:var(--goldbg)}
.d-name{font-size:10px;color:var(--cream3);letter-spacing:.07em;text-transform:uppercase;font-weight:500}
.day-btn.active .d-name,.day-btn.is-today .d-name{color:var(--gold)}
.d-num{font-size:18px;font-weight:300;color:var(--cream2)}
.day-btn.active .d-num{color:var(--cream);font-weight:400}
.d-pips{display:flex;gap:2px;height:4px}
.pip{width:4px;height:4px;border-radius:50%;background:var(--b2);transition:background .25s}
.pip.done{background:var(--em)}
.pip.missed{background:var(--rose)}

.prog-card{margin:0 20px 12px;background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:14px 18px;flex-shrink:0}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-lbl{font-size:11px;color:var(--cream3);letter-spacing:.05em;text-transform:uppercase}
.prog-frac{font-size:13px;color:var(--gold);font-weight:500}
.prog-track{height:4px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--em),var(--gold2));border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px rgba(110,207,158,.4)}
.prog-msg{font-size:11px;color:var(--cream3);margin-top:8px;min-height:13px;letter-spacing:.02em}

.task-list{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 20px}
.task-list::-webkit-scrollbar{display:none}
.task{display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:18px;border:1px solid var(--b1);background:var(--s1);margin-bottom:8px;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.task::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.03),transparent 60%);pointer-events:none}
.task:hover{background:var(--s2);border-color:var(--b2);transform:translateY(-1px)}
.task:active{transform:scale(.98);opacity:.85}
.task.done{background:var(--embg);border-color:var(--embdr)}
.task.missed{background:var(--rosebg);border-color:var(--rosebdr)}
.cb{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--b3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:all .25s cubic-bezier(.34,1.56,.64,1);background:var(--s2)}
.task.done .cb{background:var(--embg);border-color:var(--em);color:var(--em);transform:scale(1.08);box-shadow:0 0 12px rgba(110,207,158,.25)}
.task.missed .cb{background:var(--rosebg);border-color:var(--rose);color:var(--rose)}
.t-body{flex:1;min-width:0}
.t-text{font-size:14px;color:var(--cream);line-height:1.35;transition:all .2s}
.task.done .t-text{color:var(--cream3);text-decoration:line-through;text-decoration-color:rgba(110,207,158,.45)}
.task.missed .t-text{color:var(--cream3)}
.t-idx{font-size:10px;color:var(--cream3);margin-top:2px;letter-spacing:.04em;opacity:.6}
.t-badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;flex-shrink:0;padding:3px 9px;border-radius:8px}
.task.done .t-badge{color:var(--em);background:var(--embg)}
.task.missed .t-badge{color:var(--rose);background:var(--rosebg)}

.add-bar{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--b1);background:rgba(13,13,26,.85);backdrop-filter:blur(20px);flex-shrink:0}
.add-inp{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:14px;padding:11px 16px;font-family:'Jost',sans-serif;font-size:14px;color:var(--cream);outline:none;-webkit-appearance:none;transition:border-color .2s}
.add-inp::placeholder{color:var(--cream3)}
.add-inp:focus{border-color:var(--goldbdr)}
.add-go{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--gold),#b8842a);border:none;color:#0d0d1a;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(212,168,90,.35);transition:all .2s}
.add-go:hover{transform:scale(1.06)}
.add-go:active{transform:scale(.94)}
@keyframes slIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.task{animation:slIn .35s ease both}

/* ── STATS PAGE ── */
.stats-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 20px 20px}
.stats-scroll::-webkit-scrollbar{display:none}

.stat-section{margin-bottom:18px}
.stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.stat-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--cream);font-style:italic}
.stat-sub{font-size:11px;color:var(--cream3);letter-spacing:.05em}

/* Period toggle */
.period-toggle{display:flex;gap:4px;background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:3px}
.pt-btn{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--cream3);background:none;border:none;font-family:'Jost',sans-serif;cursor:pointer;padding:5px 12px;border-radius:9px;transition:all .2s}
.pt-btn.active{background:var(--goldbg);color:var(--gold);border:1px solid var(--goldbdr)}

/* Summary pills */
.stat-pills{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat-pill{flex:1;min-width:80px;background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:12px 14px;text-align:center}
.pill-val{font-size:22px;font-weight:300;color:var(--cream);font-family:'Cormorant Garamond',serif;line-height:1}
.pill-lbl{font-size:10px;color:var(--cream3);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.pill-val.green{color:var(--em)}
.pill-val.gold{color:var(--gold2)}

/* Chart card */
.chart-card{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:16px 16px 12px;margin-bottom:14px}
.chart-wrap{position:relative;width:100%}
canvas{display:block;width:100%!important}

/* Heatmap */
.heatmap-card{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:16px}
.hm-grid{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.hm-row{display:flex;align-items:center;gap:4px}
.hm-label{font-size:10px;color:var(--cream3);width:28px;text-align:right;letter-spacing:.04em;flex-shrink:0}
.hm-cells{display:flex;gap:3px;flex:1}
.hm-cell{flex:1;height:22px;border-radius:5px;background:var(--s2);border:1px solid var(--b1);transition:background .3s;cursor:default;position:relative}
.hm-cell:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e1e3a;border:1px solid var(--b2);border-radius:8px;padding:4px 8px;font-size:10px;color:var(--cream);white-space:nowrap;pointer-events:none;z-index:10}
.hm-months{display:flex;gap:3px;margin-left:32px;margin-bottom:2px}
.hm-mon{flex:1;font-size:9px;color:var(--cream3);letter-spacing:.04em;text-align:center}

/* best streak */
.streak-row{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 14px;background:var(--goldbg);border:1px solid var(--goldbdr);border-radius:14px}
.streak-fire{font-size:22px}
.streak-info .streak-val{font-size:18px;font-weight:300;color:var(--gold2);font-family:'Cormorant Garamond',serif}
.streak-info .streak-lbl{font-size:11px;color:var(--cream3);letter-spacing:.04em}

.hint{margin:0 20px 12px;padding:11px 16px;background:var(--goldbg);border:1px solid var(--goldbdr);border-radius:14px;font-size:11px;color:var(--gold);line-height:1.6;display:none;flex-shrink:0}
</style>
</head>
<body>
<div class="scene"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div class="grain"></div>

<div class="wrap">
  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-l">
      <div class="eyebrow">Routine quotidienne</div>
      <div class="headline">Ma <em>Journée</em></div>
    </div>
    <div class="hdr-r">
      <div class="date-chip" id="dateChip">—</div>
      <button class="reset-btn" id="resetBtn">↺ reset</button>
    </div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button class="nav-tab active" data-page="today">Aujourd'hui</button>
    <button class="nav-tab" data-page="stats">Statistiques</button>
  </div>

  <div class="hint" id="hint">📲 <strong>iPhone :</strong> Partager → Sur l'écran d'accueil &nbsp;·&nbsp; <strong>Mac :</strong> Fichier → Installer la page web</div>

  <!-- TODAY PAGE -->
  <div class="page active" id="page-today">
    <div class="day-strip" id="dayStrip"></div>
    <div class="prog-card">
      <div class="prog-top"><span class="prog-lbl">Progression</span><span class="prog-frac" id="progFrac">0 / 8</span></div>
      <div class="prog-track"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
      <div class="prog-msg" id="progMsg"></div>
    </div>
    <div class="task-list" id="taskList"></div>
    <div class="add-bar">
      <input class="add-inp" id="newTask" type="text" placeholder="Ajouter une tâche…" autocomplete="off" spellcheck="false">
      <button class="add-go" id="addGo">+</button>
    </div>
  </div>

  <!-- STATS PAGE -->
  <div class="page" id="page-stats">
    <div class="stats-scroll" id="statsScroll">

      <!-- Summary pills -->
      <div class="stat-pills" id="statPills">
        <div class="stat-pill"><div class="pill-val green" id="s-avg">—</div><div class="pill-lbl">Moy. / jour</div></div>
        <div class="stat-pill"><div class="pill-val gold" id="s-best">—</div><div class="pill-lbl">Meilleur jour</div></div>
        <div class="stat-pill"><div class="pill-val" id="s-streak">—</div><div class="pill-lbl">Série en cours</div></div>
      </div>

      <!-- Weekly chart -->
      <div class="stat-section">
        <div class="stat-head">
          <span class="stat-title">Par semaine</span>
          <div class="period-toggle" id="weekToggle">
            <button class="pt-btn active" data-w="4">4 sem.</button>
            <button class="pt-btn" data-w="8">8 sem.</button>
            <button class="pt-btn" data-w="12">12 sem.</button>
          </div>
        </div>
        <div class="chart-card"><div class="chart-wrap"><canvas id="weekChart" height="160"></canvas></div></div>
      </div>

      <!-- Monthly chart -->
      <div class="stat-section">
        <div class="stat-head">
          <span class="stat-title">Par mois</span>
          <span class="stat-sub" id="monthSub">12 derniers mois</span>
        </div>
        <div class="chart-card"><div class="chart-wrap"><canvas id="monthChart" height="160"></canvas></div></div>
      </div>

      <!-- Heatmap -->
      <div class="stat-section">
        <div class="stat-head"><span class="stat-title">Heatmap</span><span class="stat-sub">7 dernières semaines</span></div>
        <div class="heatmap-card" id="heatmapCard"></div>
      </div>

      <!-- Best streak -->
      <div class="streak-row">
        <div class="streak-fire">🔥</div>
        <div class="streak-info">
          <div class="streak-val" id="bestStreakVal">0 jour</div>
          <div class="streak-lbl">Meilleure série consécutive</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/* ── DATA ── */
const DAYS_S=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const DAYS_F=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MONTHS_S=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const MONTHS_L=['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
const MSGS={0:'',1:'C\'est parti 💪',2:'Belle lancée !',3:'À mi-chemin 🔥',4:'Plus que quelques tâches !',5:'Presque fini !',6:'Journée accomplie ✨',7:'Journée accomplie ✨',8:'Journée accomplie ✨'};
const DEFAULT=['Faire mon lit','Lire 10p de "La Parole et l\'Écrit"','Lire 10p de Power','Prendre la créatine','Éviter de grignoter','1h d\'étude de Torah','1h de sport (en plus de Liran)','Réviser les psycho'];

function load(){try{const r=localStorage.getItem('mj4');if(r)return JSON.parse(r)}catch(e){}return{tasks:[...DEFAULT],hist:{}}}
function save(){try{localStorage.setItem('mj4',JSON.stringify(data))}catch(e){}}

let data=load();
const NOW=new Date();
const TODAY=NOW.getDay();
let sel=TODAY;
let weekN=4;

// hist key: "YYYY-MM-DD" → {done:N, total:N}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayDate(d){const dt=new Date(NOW);dt.setDate(NOW.getDate()-NOW.getDay()+d);return dt}
function sk(ti,di){return ti+'::'+di}
function gs(ti,di){return data.states&&data.states[sk(ti,di)]||'none'}

function saveSnapshot(){
  // Save today's completion to hist
  const done=data.tasks.filter((_,ti)=>gs(ti,TODAY)==='done').length;
  const k=dateKey(NOW);
  data.hist[k]={done,total:data.tasks.length};
  save();
}

function toggleTask(ti){
  if(!data.states)data.states={};
  const s=gs(ti,sel);
  const n=s==='none'?'done':s==='done'?'missed':'none';
  if(n==='none')delete data.states[sk(ti,sel)];else data.states[sk(ti,sel)]=n;
  saveSnapshot();
  renderToday();
}

function selectDay(d){sel=d;renderToday();}

function addTask(){
  const inp=document.getElementById('newTask');
  const v=inp.value.trim();
  if(!v||data.tasks.includes(v)){inp.value='';return}
  data.tasks.push(v);inp.value='';save();renderToday();
}

function resetDay(){
  if(!confirm('Réinitialiser ce jour ?'))return;
  data.tasks.forEach((_,i)=>delete data.states[sk(i,sel)]);
  save();renderToday();
}

/* ── TODAY RENDER ── */
function renderToday(){
  const dt=dayDate(sel);
  const isToday=sel===TODAY;
  document.getElementById('dateChip').textContent=(isToday?'Aujourd\'hui · ':DAYS_F[sel]+' ')+dt.getDate()+' '+MONTHS_L[dt.getMonth()];

  const strip=document.getElementById('dayStrip');strip.innerHTML='';
  for(let i=0;i<7;i++){
    const dt2=dayDate(i);const isT=i===TODAY,isS=i===sel;
    const div=document.createElement('div');
    div.className='day-btn'+(isS?' active':'')+(isT?' is-today':'');
    const pips=data.tasks.slice(0,8).map((_,ti)=>{const s=gs(ti,i);return`<span class="pip ${s==='none'?'':s}"></span>`}).join('');
    div.innerHTML=`<span class="d-name">${DAYS_S[i]}</span><span class="d-num">${dt2.getDate()}</span><div class="d-pips">${pips}</div>`;
    div.addEventListener('click',()=>selectDay(i));strip.appendChild(div);
  }

  const done=data.tasks.filter((_,ti)=>gs(ti,sel)==='done').length;
  const total=data.tasks.length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progFrac').textContent=done+' / '+total;
  document.getElementById('progMsg').textContent=MSGS[done]||'';

  const list=document.getElementById('taskList');list.innerHTML='';
  data.tasks.forEach((t,ti)=>{
    const s=gs(ti,sel);
    const div=document.createElement('div');
    div.className='task'+(s!=='none'?' '+s:'');
    div.style.animationDelay=(ti*0.04)+'s';
    const icon=s==='done'?'✓':s==='missed'?'✕':'';
    const badge=s==='none'?'':`<span class="t-badge">${s==='done'?'fait':'raté'}</span>`;
    div.innerHTML=`<div class="cb">${icon}</div><div class="t-body"><div class="t-text">${t.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div><div class="t-idx">${String(ti+1).padStart(2,'0')}</div></div>${badge}`;
    div.addEventListener('click',()=>toggleTask(ti));
    list.appendChild(div);
  });
}

/* ── STATS HELPERS ── */
function getPastDays(n){
  const days=[];
  for(let i=n-1;i>=0;i--){const d=new Date(NOW);d.setDate(NOW.getDate()-i);days.push(d);}
  return days;
}

function getHistPct(d){
  const k=dateKey(d);
  if(data.hist[k]&&data.hist[k].total>0) return Math.round(data.hist[k].done/data.hist[k].total*100);
  // Check live states for days in current week
  const dow=d.getDay();
  const daysDiff=Math.round((NOW-d)/(1000*60*60*24));
  if(daysDiff>=0&&daysDiff<7){
    const total=data.tasks.length;if(!total)return 0;
    const done=data.tasks.filter((_,ti)=>gs(ti,dow)==='done').length;
    return Math.round(done/total*100);
  }
  return null; // no data
}

function getWeekData(nWeeks){
  const labels=[];const vals=[];
  for(let w=nWeeks-1;w>=0;w--){
    const weekDays=[];
    for(let d=0;d<7;d++){
      const dt=new Date(NOW);
      dt.setDate(NOW.getDate()-NOW.getDay()-w*7+d);
      weekDays.push(dt);
    }
    const pcts=weekDays.map(d=>getHistPct(d)).filter(v=>v!==null);
    const avg=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):0;
    const start=weekDays[1]; // Monday
    labels.push(start.getDate()+' '+MONTHS_S[start.getMonth()]);
    vals.push(avg);
  }
  return{labels,vals};
}

function getMonthData(){
  const labels=[];const vals=[];
  for(let m=11;m>=0;m--){
    const d=new Date(NOW.getFullYear(),NOW.getMonth()-m,1);
    const label=MONTHS_S[d.getMonth()];
    const daysInMonth=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    const pcts=[];
    for(let day=1;day<=daysInMonth;day++){
      const dt=new Date(d.getFullYear(),d.getMonth(),day);
      if(dt>NOW)break;
      const p=getHistPct(dt);if(p!==null)pcts.push(p);
    }
    const avg=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):0;
    labels.push(label);vals.push(avg);
  }
  return{labels,vals};
}

function getCurrentStreak(){
  let streak=0;
  for(let i=0;i<365;i++){
    const d=new Date(NOW);d.setDate(NOW.getDate()-i);
    const p=getHistPct(d);
    if(p===null||p<50)break;
    streak++;
  }
  return streak;
}

function getBestStreak(){
  let best=0,cur=0;
  const days=getPastDays(90);
  for(const d of days){
    const p=getHistPct(d);
    if(p!==null&&p>=50){cur++;best=Math.max(best,cur);}
    else cur=0;
  }
  return best;
}

/* ── CANVAS CHART ── */
let weekChartAnim=null,monthChartAnim=null;

function drawBarChart(canvasId,labels,vals,animated){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.offsetWidth;
  const H=160;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const PAD={t:10,r:10,b:28,l:28};
  const cW=W-PAD.l-PAD.r;
  const cH=H-PAD.t-PAD.b;
  const n=vals.length;
  const barW=Math.max(4,Math.floor(cW/n*0.55));
  const gap=(cW-barW*n)/(n+1);

  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  [0,25,50,75,100].forEach(v=>{
    const y=PAD.t+cH*(1-v/100);
    ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+cW,y);ctx.stroke();
    if(v>0){ctx.fillStyle='rgba(237,232,222,0.2)';ctx.font=`${9*1}px Jost`;ctx.textAlign='right';ctx.fillText(v+'%',PAD.l-5,y+3);}
  });

  let progress=animated?0:1;
  function frame(){
    ctx.clearRect(0,0,W,H);
    // Grid
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
    [0,25,50,75,100].forEach(v=>{
      const y=PAD.t+cH*(1-v/100);
      ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+cW,y);ctx.stroke();
      ctx.fillStyle='rgba(237,232,222,0.2)';ctx.font='9px Jost';ctx.textAlign='right';ctx.fillText(v+'%',PAD.l-5,y+3);
    });

    vals.forEach((v,i)=>{
      const x=PAD.l+gap*(i+1)+barW*i;
      const fullH=cH*(v/100);
      const h=fullH*progress;
      const y=PAD.t+cH-h;

      // Bar color gradient by value
      const grad=ctx.createLinearGradient(0,y,0,y+h);
      if(v>=75){grad.addColorStop(0,'rgba(110,207,158,0.9)');grad.addColorStop(1,'rgba(110,207,158,0.4)');}
      else if(v>=40){grad.addColorStop(0,'rgba(240,201,122,0.9)');grad.addColorStop(1,'rgba(240,201,122,0.4)');}
      else{grad.addColorStop(0,'rgba(240,128,128,0.8)');grad.addColorStop(1,'rgba(240,128,128,0.3)');}

      ctx.fillStyle=grad;
      const r=Math.min(5,barW/2);
      ctx.beginPath();
      if(h>r*2){
        ctx.moveTo(x+r,y);ctx.lineTo(x+barW-r,y);ctx.quadraticCurveTo(x+barW,y,x+barW,y+r);
        ctx.lineTo(x+barW,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
      }else{ctx.rect(x,y,barW,Math.max(h,2));}
      ctx.fill();

      // Label
      ctx.fillStyle='rgba(237,232,222,0.35)';ctx.font='9px Jost';ctx.textAlign='center';
      ctx.fillText(labels[i],x+barW/2,H-PAD.b+13);

      // Value on top if >0
      if(v>0&&progress>0.5){
        ctx.fillStyle=v>=75?'rgba(110,207,158,0.8)':v>=40?'rgba(240,201,122,0.8)':'rgba(240,128,128,0.7)';
        ctx.font='bold 9px Jost';ctx.textAlign='center';
        ctx.fillText(Math.round(v*progress)+'%',x+barW/2,y-4);
      }
    });

    if(progress<1){progress=Math.min(1,progress+0.05);requestAnimationFrame(frame);}
  }
  frame();
}

/* ── HEATMAP ── */
function renderHeatmap(){
  const card=document.getElementById('heatmapCard');
  const nWeeks=7;
  const days=['L','M','M','J','V','S','D'];
  // Build grid: rows = days of week (Mon-Sun), cols = weeks
  let html='<div style="font-size:11px;color:rgba(237,232,222,0.4);letter-spacing:.05em;margin-bottom:8px">Complétion par jour</div>';

  // Month labels across top
  html+='<div class="hm-months">';
  for(let w=nWeeks-1;w>=0;w--){
    const d=new Date(NOW);d.setDate(NOW.getDate()-NOW.getDay()-w*7+1);
    html+=`<div class="hm-mon">${w===nWeeks-1||d.getDate()<=7?MONTHS_S[d.getMonth()]:''}</div>`;
  }
  html+='</div><div class="hm-grid">';

  for(let dow=1;dow<=7;dow++){
    const realDow=dow%7; // 1=Mon,...,0=Sun
    html+=`<div class="hm-row"><div class="hm-label">${days[dow-1]}</div><div class="hm-cells">`;
    for(let w=nWeeks-1;w>=0;w--){
      const d=new Date(NOW);
      d.setDate(NOW.getDate()-NOW.getDay()-w*7+realDow);
      if(d>NOW){html+='<div class="hm-cell" style="background:transparent;border:none"></div>';continue;}
      const p=getHistPct(d);
      let bg='var(--s2)';
      if(p!==null&&p>0){
        if(p>=75)bg=`rgba(110,207,158,${0.2+p/100*0.7})`;
        else if(p>=40)bg=`rgba(240,201,122,${0.15+p/100*0.6})`;
        else bg=`rgba(240,128,128,${0.15+p/100*0.5})`;
      }
      const tip=p!==null?`${d.getDate()} ${MONTHS_S[d.getMonth()]} · ${p}%`:`${d.getDate()} ${MONTHS_S[d.getMonth()]}`;
      html+=`<div class="hm-cell" style="background:${bg}" data-tip="${tip}"></div>`;
    }
    html+='</div></div>';
  }
  html+='</div>';
  card.innerHTML=html;
}

/* ── STATS RENDER ── */
function renderStats(){
  const {vals:wv}=getWeekData(weekN);
  const validW=wv.filter(v=>v>0);
  const avgDay=validW.length?Math.round(validW.reduce((a,b)=>a+b,0)/validW.length):0;
  const bestDay=validW.length?Math.max(...validW):0;
  const streak=getCurrentStreak();
  const bestStreak=getBestStreak();

  document.getElementById('s-avg').textContent=avgDay+'%';
  document.getElementById('s-best').textContent=bestDay+'%';
  document.getElementById('s-streak').textContent=streak+' j';
  document.getElementById('bestStreakVal').textContent=bestStreak+' jour'+(bestStreak>1?'s':'');

  const {labels:wl,vals:wvals}=getWeekData(weekN);
  drawBarChart('weekChart',wl,wvals,true);

  const {labels:ml,vals:mv}=getMonthData();
  drawBarChart('monthChart',ml,mv,true);

  renderHeatmap();
}
